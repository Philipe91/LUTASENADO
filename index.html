<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <title>República Kombat</title>
    <meta name="description" content="Jogo de luta satírico no navegador. Obra de ficção e sátira." />
    <meta name="theme-color" content="#0b0f0d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icons/favicon-48.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <!-- fontes servidas localmente (portais não aceitam requisição externa); latin cobre o português.
         UI: Anton (display) + Barlow Condensed (texto). Bangers só para letreiros 3D em canvas (cenário/VFX), sem preload. -->
    <link rel="preload" href="fonts/anton-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/barlow-condensed-latin-700.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face { font-family: 'Anton'; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/anton-latin.woff2) format('woff2'); }
      @font-face { font-family: 'Barlow Condensed'; font-style: normal; font-weight: 500; font-display: swap; src: url(fonts/barlow-condensed-latin-500.woff2) format('woff2'); }
      @font-face { font-family: 'Barlow Condensed'; font-style: normal; font-weight: 700; font-display: swap; src: url(fonts/barlow-condensed-latin-700.woff2) format('woff2'); }
      @font-face { font-family: 'Barlow Condensed'; font-style: normal; font-weight: 800; font-display: swap; src: url(fonts/barlow-condensed-latin-800.woff2) format('woff2'); }
      @font-face { font-family: 'Bangers'; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/bangers-latin.woff2) format('woff2'); }
      /* tela de carregamento inline: aparece no 1º quadro, antes de qualquer JS (mesma identidade da UI: verde-tinta, ouro, chanfro) */
      html, body { margin: 0; height: 100%; background: #0b0f0d; overflow: hidden; }
      #boot { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; color: #efe6d2;
        background: radial-gradient(ellipse 70% 60% at 50% 110%, #126b4555, #0000 70%), #0b0f0d; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; transition: opacity .35s; }
      #boot.out { opacity: 0; pointer-events: none; }
      #boot .blogo { font: 400 clamp(44px, 9vw, 96px)/.9 'Anton', Impact, 'Arial Narrow Bold', sans-serif; letter-spacing: 1px; text-align: center; text-transform: uppercase; color: #efe6d2; }
      #boot .blogo span { display: block; color: #e9b933; font-size: 1.22em; letter-spacing: 2px; }
      #boot .bbar { width: min(320px, 70vw); height: 4px; background: #efe6d222; overflow: hidden; }
      #boot .bbar i { display: block; height: 100%; width: 8%; background: #e9b933; transition: width .25s; }
      #boot .bmsg { font-size: 12px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; opacity: .6; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <div id="boot"><div class="blogo">República <span>Kombat</span></div><div class="bbar"><i></i></div><div class="bmsg">Carregando</div></div>
    <noscript>Ative o JavaScript para jogar.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
